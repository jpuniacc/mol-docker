services:
  mol-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_KEY: ${VITE_SUPABASE_KEY}
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_SIMULADOR_SUPABASE_URL: ${VITE_SIMULADOR_SUPABASE_URL:-}
        VITE_SIMULADOR_SUPABASE_ANON_KEY: ${VITE_SIMULADOR_SUPABASE_ANON_KEY:-}
        VITE_AUTH_ORIGIN: ${VITE_AUTH_ORIGIN:-1}
        VITE_AUTH_AMBIENTE: ${VITE_AUTH_AMBIENTE:-1}
        VITE_MNP_MV_ANIO_MATRICULA: ${VITE_MNP_MV_ANIO_MATRICULA:-}
        VITE_MNP_MV_PERIODO_MATRICULA: ${VITE_MNP_MV_PERIODO_MATRICULA:-}
        VITE_DEBUG_BO_MENU: ${VITE_DEBUG_BO_MENU:-}
    container_name: mol-dev
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      REMATRICULA_API_KEY: ${REMATRICULA_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_default"
      # Prioridad alta: todo el Host (incl. /api) entra a nginx, que proxea APIs e inyecta X-API-Key
      - "traefik.http.routers.mol-dev.rule=Host(`mol-dev.uniacc.cl`)"
      - "traefik.http.routers.mol-dev.entrypoints=web"
      - "traefik.http.routers.mol-dev.priority=200"
      - "traefik.http.services.mol-dev.loadbalancer.server.port=80"
    networks:
      - traefik_default

networks:
  traefik_default:
    external: true
